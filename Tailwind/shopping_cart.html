<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Shopping Cart Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 md:p-8">
    
    <div id="shopping-cart-container" class="flex flex-col lg:flex-row gap-8 w-full max-w-6xl bg-slate-800 p-6 md:p-8 rounded-2xl shadow-2xl border border-slate-700">
      
      <div id="products-container" class="flex-1 flex flex-col gap-4">
        <h1 class="text-2xl font-bold tracking-tight mb-2 text-indigo-400">Your Cart</h1>
        
        <div class="card flex flex-col sm:flex-row items-start sm:items-center justify-between p-4 bg-slate-700/50 rounded-xl border border-slate-600/50 hover:border-indigo-500/50 transition-colors gap-4">
          <div class="flex flex-col gap-1">
            <h2 class="text-xl font-semibold text-white">Wireless Studio Headphones</h2>
            <p class="text-sm text-slate-400">Premium Over-Ear Audio</p>
          </div>
          <div class="flex items-center justify-between sm:justify-end gap-8 w-full sm:w-auto">
            <div class="text-sm bg-slate-800 px-3 py-1 rounded-full border border-slate-600">
              Qty: <span class="quantity font-medium text-indigo-300">1</span>
            </div>
            <div class="price font-semibold text-lg text-emerald-400">$199.99</div>
            <button class="remove-button px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 focus:ring-offset-slate-800">
              Remove
            </button>
          </div>
        </div>

        <div class="card flex flex-col sm:flex-row items-start sm:items-center justify-between p-4 bg-slate-700/50 rounded-xl border border-slate-600/50 hover:border-indigo-500/50 transition-colors gap-4">
          <div class="flex flex-col gap-1">
            <h2 class="text-xl font-semibold text-white">Mechanical Synth Keyboard</h2>
            <p class="text-sm text-slate-400">61-Key MIDI Controller</p>
          </div>
          <div class="flex items-center justify-between sm:justify-end gap-8 w-full sm:w-auto">
            <div class="text-sm bg-slate-800 px-3 py-1 rounded-full border border-slate-600">
              Qty: <span class="quantity font-medium text-indigo-300">2</span>
            </div>
            <div class="price font-semibold text-lg text-emerald-400">$149.50</div>
            <button class="remove-button px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 focus:ring-offset-slate-800">
              Remove
            </button>
          </div>
        </div>
      </div>

      <div id="order-summary-container" class="w-full lg:w-80 bg-slate-900/60 p-6 rounded-xl border border-slate-600 flex flex-col justify-between h-fit min-h-[280px]">
        <div>
          <h2 class="text-xl font-bold text-white mb-6 tracking-wide border-b border-slate-700 pb-3">Order Summary</h2>
          
          <div class="flex items-center justify-between mb-4 text-slate-300">
            <span>Subtotal</span>
            <span class="font-medium">$498.99</span>
          </div>
          <div class="flex items-center justify-between mb-6 text-slate-300">
            <span>Shipping</span>
            <span class="font-medium text-emerald-400">FREE</span>
          </div>
        </div>

        <div class="border-t border-slate-700 pt-4 mt-auto">
          <div class="flex items-baseline justify-between mb-6">
            <span id="total" class="text-lg font-bold text-slate-200">Total:</span>
            <span id="total-amount" class="text-2xl font-extrabold text-white">$498.99</span>
          </div>
          
          <a href="#" class="block w-full text-center text-white bg-blue-600 hover:bg-blue-700 font-semibold py-3 px-4 rounded-xl transition-colors shadow-lg shadow-blue-600/20 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-slate-900">
            Checkout
          </a>
        </div>
      </div>

    </div>
  </body>
</html>
